<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chung Woo Young | Photography</title>
    <meta name="description" content="Selected photography by Chung Woo Young." />
    <meta property="og:title" content="Chung Woo Young | Photography" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.chungwooyoung.com/" />
    <meta property="og:image" content="https://www.chungwooyoung.com/assets/images/full/og-cover.jpg" />
    <link rel="canonical" href="https://www.chungwooyoung.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css?v=book-prototype-1" />
  </head>
  <body data-view="cover">
    <main class="portfolio-stage" aria-live="polite">
      <header class="identity" data-identity>
        <p class="identity-role">Photographer · Seoul</p>
        <h1 data-site-name-main>Chung Woo Young</h1>
      </header>

      <section class="cover-scene" data-cover-scene aria-label="Portfolio cover">
        <button class="book-cover" type="button" data-open-book aria-label="Open Chung Woo Young portfolio">
          <span class="cover-edge" aria-hidden="true"></span>
          <span class="cover-copy">
            <span class="cover-title" data-site-name>Chung Woo Young</span>
            <span class="cover-subtitle">Selected Photographs</span>
            <span class="cover-year">Portfolio · MMXXVI</span>
          </span>
          <span class="cover-prompt">Open</span>
        </button>
      </section>

      <section class="book-view" data-book-view aria-label="Selected works" aria-hidden="true">
        <button class="book-nav book-nav-prev" type="button" data-book-prev aria-label="Previous pages">
          <span aria-hidden="true">←</span>
        </button>

        <div class="book-area">
          <div class="book" data-book>
            <div class="book-shadow" aria-hidden="true"></div>
            <article class="paper-page paper-left" data-page-left aria-label="Left portfolio page"></article>
            <span class="book-gutter" aria-hidden="true"></span>
            <article class="paper-page paper-right" data-page-right aria-label="Right portfolio page"></article>
            <div class="turning-sheet" data-turning-sheet aria-hidden="true">
              <div class="turn-face turn-front"></div>
              <div class="turn-face turn-back"></div>
            </div>
          </div>

          <div class="book-status">
            <button type="button" class="return-cover" data-return-cover>Cover</button>
            <span data-page-status>01 / 01</span>
            <button type="button" class="open-info" data-open-info>Info</button>
          </div>
        </div>

        <button class="book-nav book-nav-next" type="button" data-book-next aria-label="Next pages">
          <span aria-hidden="true">→</span>
        </button>
      </section>
    </main>

    <div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
      <button class="overlay-close" type="button" data-lightbox-close aria-label="Close image viewer">Close</button>
      <button class="lightbox-arrow lightbox-prev" type="button" data-lightbox-prev aria-label="Previous image">←</button>
      <figure class="lightbox-figure">
        <picture>
          <source type="image/webp" data-lightbox-webp />
          <img data-lightbox-image alt="" decoding="async" />
        </picture>
        <figcaption>
          <span data-lightbox-title></span>
          <span data-lightbox-meta></span>
        </figcaption>
      </figure>
      <button class="lightbox-arrow lightbox-next" type="button" data-lightbox-next aria-label="Next image">→</button>
    </div>

    <div class="info-panel" data-info-panel role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
      <button class="overlay-close" type="button" data-close-info>Close</button>
      <div class="info-copy">
        <p class="info-kicker">Info</p>
        <h2 id="info-title" data-site-name-inline>Chung Woo Young</h2>
        <p>
          Photographer based in <span data-site-location>Seoul, South Korea</span>, focused on human presence,
          light, material, and precise visual rhythm.
        </p>
        <dl>
          <div><dt>Email</dt><dd><a data-contact-email href="mailto:hello@chungwooyoung.com">hello@chungwooyoung.com</a></dd></div>
          <div><dt>Instagram</dt><dd><a data-contact-instagram href="https://instagram.com/chungwooyoung" target="_blank" rel="noreferrer noopener">@chungwooyoung</a></dd></div>
        </dl>
      </div>
    </div>

    <div class="toast" data-toast aria-live="polite" hidden></div>
    <noscript><p class="noscript-msg">JavaScript is required to open this portfolio.</p></noscript>
    <script type="module" src="assets/js/app.js?v=book-prototype-1"></script>
  </body>
</html>
