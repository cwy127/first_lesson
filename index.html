<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Photography portfolio of Chung Woo Young, Seoul.">
  <meta name="theme-color" content="#f1f1ef">
  <title>Chung Woo Young | Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=square-tiles-1">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="Chung Woo Young home">Chung Woo Young</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <button class="text-button" type="button" data-about-open>Info</button>
      <a class="text-link" data-email-link href="mailto:hello@chungwooyoung.com">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="gallery-shell" aria-labelledby="works-title">
      <h1 id="works-title" class="sr-only">Selected works</h1>
      <div class="photo-grid" data-photo-grid aria-live="polite"></div>
      <p class="loading-note" data-loading-note>Loading photographs…</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>Selected works</span>
    <span data-year></span>
  </footer>

  <dialog class="lightbox" data-lightbox aria-label="Photograph viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close photograph">Close</button>
    <figure class="lightbox-figure">
      <img data-lightbox-image src="" alt="">
      <figcaption data-lightbox-caption></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-prev" type="button" data-lightbox-prev aria-label="Previous photograph">←</button>
    <button class="lightbox-nav lightbox-next" type="button" data-lightbox-next aria-label="Next photograph">→</button>
  </dialog>

  <dialog class="about-panel" data-about-panel aria-labelledby="about-title">
    <button class="about-close" type="button" data-about-close aria-label="Close information">Close</button>
    <div class="about-copy">
      <p class="eyebrow">Photographer</p>
      <h2 id="about-title" data-site-name>Chung Woo Young</h2>
      <p data-site-tagline>Visual stories crafted through light, texture, and precise framing.</p>
      <p class="about-location" data-site-location>Seoul, South Korea</p>
      <a data-about-email href="mailto:hello@chungwooyoung.com">hello@chungwooyoung.com</a>
    </div>
  </dialog>

  <noscript>This portfolio requires JavaScript to load the photographs.</noscript>
  <script src="assets/js/app.js?v=square-tiles-1" defer></script>
</body>
</html>
